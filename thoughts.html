<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thoughts | Lazareis Soaked</title>
    <meta
      name="description"
      content="A collection of short notes and thoughts by Lazareis Soaked."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <div class="brand">Lazareis Soaked</div>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html#about">About</a>
          <a href="index.html#cv">CV</a>
          <a href="index.html#publications">Publications</a>
          <a href="index.html#projects">Projects</a>
          <a href="index.html#interests">Interests</a>
          <a href="thoughts.html">Thoughts</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="content-section">
        <div class="container narrow">
          <h2>Thoughts</h2>
          <p>
            Short notes and reflections, listed in order. Click any entry to
            read it.
          </p>
          <ol id="thoughts-list" class="thoughts-list">
            <li class="note">Loading…</li>
          </ol>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© 2024 Lazareis Soaked</p>
      </div>
    </footer>

    <script>
      async function loadThoughts() {
        const listEl = document.getElementById("thoughts-list");
        try {
          const manifestRes = await fetch("thoughts/manifest.json");
          if (!manifestRes.ok) throw new Error("Failed to load manifest");
          const files = await manifestRes.json();

          const entries = await Promise.all(
            files.map(async (file) => {
              const res = await fetch(`thoughts/${file}`);
              const text = res.ok ? await res.text() : "";
              const titleMatch = text.match(/^#\s+(.+)$/m);
              const title = titleMatch ? titleMatch[1] : file;
              return { file, title };
            })
          );

          listEl.innerHTML = "";
          entries.forEach(({ file, title }) => {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = `thought.html?post=${encodeURIComponent(file)}`;
            a.textContent = title;
            li.appendChild(a);
            listEl.appendChild(li);
          });

          if (entries.length === 0) {
            listEl.innerHTML = '<li class="note">No thoughts yet.</li>';
          }
        } catch (err) {
          listEl.innerHTML =
            '<li class="note">Unable to load thoughts right now.</li>';
        }
      }

      loadThoughts();
    </script>
  </body>
</html>
